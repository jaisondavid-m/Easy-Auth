services:
  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - server

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    expose:
      - "8080"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ec_auth
      MYSQL_USER: ec_auth_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"

volumes:
  mysql_data: